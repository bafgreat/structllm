  - id: long_edit_history_session
    behaviour: execute
    brief: The user asks for a named molecule to be built.
    tools:
    - build_structure
    slots:
      molecule:
      - benzene
      - pyridine
      - toluene
      group:
      - amino
      - fluoro
      group2:
      - hydroxyl
      - methyl
      - chloro
    followups:
    - behaviour: execute
      brief: The user asks to put a named functional group on it.
      tools:
      - functionalise
      uses_prior_revision: true
      slots:
      - group
    - behaviour: execute
      brief: The user asks to put a second, different named group on the result.
      tools:
      - functionalise
      uses_prior_revision: true
      slots:
      - group2
    - behaviour: execute
      brief: The user asks for the structure exactly as it was before either group was added, as an xyz file, without saying
        which revision.
      tools:
      - export_structure
      forbidden_tools:
      - functionalise
      - relax
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the version with both groups as a pdb file.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 5
  
  - id: long_two_structures_session
    behaviour: execute
    brief: The user asks for a first named molecule to be built.
    tools:
    - build_structure
    slots:
      first:
      - benzene
      - ethanol
      - toluene
      second:
      - pyridine
      - acetone
      - phenol
    followups:
    - behaviour: execute
      brief: The user asks for a second, different molecule to be built too.
      tools:
      - build_structure
      slots:
      - second
    - behaviour: execute
      brief: The user asks to relax the first molecule, naming it, not the one just built.
      tools:
      - relax
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the molecular properties of the second molecule, which was not relaxed.
      tools:
      - analyse
      uses_prior_revision: true
    variants: 5
  
  - id: long_named_mof_session
    behaviour: execute
    brief: A user wants a well-known MOF opened by its common name.
    tools:
    - open_named_framework
    - lookup_name
    - suggest_names
    slots:
      mof:
      - HKUST-1
      - UiO-66
      - MOF-5
      - ZIF-8
    followups:
    - behaviour: execute
      brief: The user asks for the metal nodes and open metal sites of it.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks to break it into its distinct building units.
      tools:
      - deconstruct
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks to remove any unbound solvent from the framework.
      tools:
      - remove_guests
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the cleaned framework as a CIF.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 5
  
  - id: long_peptide_session
    behaviour: execute
    brief: The user asks for a short peptide with a stated sequence to be built.
    tools:
    - build_structure
    slots:
      sequence:
      - GGG
      - YGGFL
      - KLVFF
      - AGS
      ph:
      - '7'
      - '7.4'
      - '5'
      sequence2:
      - AAA
      - GAG
    followups:
    - behaviour: execute
      brief: The user asks to protonate it at a stated pH and prepare it for an AMBER simulation.
      tools:
      - prepare_biomolecule
      uses_prior_revision: true
      slots:
      - ph
    - behaviour: execute
      brief: The user asks for the prepared peptide as a pdb file.
      tools:
      - export_structure
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks to build a second peptide with a different sequence next.
      tools:
      - build_structure
      slots:
      - sequence2
    variants: 5
  
  - id: long_correction_session
    behaviour: execute
    brief: The user asks for a named zeolite framework.
    tools:
    - build_structure
    slots:
      wrong:
      - MFI
      - CHA
      right:
      - LTA
      - FAU
      gas:
      - CO2
      - methane
      temperature:
      - 298 K
      - 273 K
    followups:
    - behaviour: execute
      brief: The user says they typed the wrong one and gives the right zeolite, asking to build that instead.
      tools:
      - build_structure
      slots:
      - right
    - behaviour: execute
      brief: The user asks for its porosity.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for a quick Henry constant for a named gas at a stated temperature.
      tools:
      - guest_isotherm
      forbidden_tools:
      - guest_gcmc
      uses_prior_revision: true
      slots:
      - gas
      - temperature
    variants: 5
  
  - id: long_battery_session
    behaviour: execute
    brief: The user asks for a lithium crystal to be built from its formula.
    tools:
    - build_structure
    slots:
      formula:
      - LiCoO2
      - LiF
    followups:
    - behaviour: execute
      brief: The user asks for a quick bond-valence estimate of how easily lithium moves through it.
      tools:
      - ion_migration
      uses_prior_revision: true
    - behaviour: approval_hold
      brief: The user asks for a more rigorous barrier for the worst hop, from a NEB calculation.
      tools:
      - ion_hop_barrier
      uses_prior_revision: true
    - behaviour: approval_hold
      brief: The user asks for the average intercalation voltage and capacity too.
      tools:
      - ion_voltage
      uses_prior_revision: true
    variants: 3
  
  - id: long_recall_session
    behaviour: execute
    brief: The user asks for a named zeolite to be built.
    tools:
    - build_structure
    slots:
      zeolite:
      - SOD
      - LTA
      - CHA
    followups:
    - behaviour: execute
      brief: The user asks for the porosity and topology of it.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for a quick force-field relaxation, keeping the cell fixed.
      tools:
      - relax
      uses_prior_revision: true
    - behaviour: discuss
      brief: The user asks what the topology of the structure was, as found earlier, and how the energy changed on relaxing,
        without asking for anything to be rerun.
      forbidden_tools:
      - analyse
      - relax
    variants: 5
  
