      brief: The user asks to check once more that nothing overlaps now.
      tools:
      - find_overlaps
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the porosity of the cleaned structure.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the cleaned structure as a CIF.
      tools:
