# Scenario specs for synthetic StructLLM conversations.
#
# A request writer turns each spec into several conversations; a teacher then
# answers them through the orchestrator against the development server. Specs
# describe what the user wants, never what the assistant says.
#
# behaviour: what a good answer to a user message does
#   execute        use the listed tools and report the result
#   clarify        required information is missing: ask, run nothing that changes anything
#   approval_hold  the request is expensive: submit once, report that it waits for approval
#   unsupported    StructSub cannot do it: say so (find_tools may be used to check)
#   failure        the input is invalid: report the backend error and how to fix it
#   discuss        answer from the conversation so far; run nothing that changes anything
# tools:           tools a good answer is expected to use
# forbidden_tools: tools a good answer must not use. These catch answers driven
#                  by words rather than meaning ("don't relax it" must not relax).
# uses_prior_revision: structure arguments must name a revision that already
#                  appeared in the conversation, so "it" is resolved from context.
# setup:           cheap calls made before the conversation; the last
#                  structure_revision_id is given as the current structure.
# slots:           values the writer must use so conversations differ in
#                  substance. A follow-up lists the slots it uses; the first
#                  message uses the rest. zip_slots: value i of each slot list
#                  belongs together.
# followups:       later user messages in the same conversation, each with its
#                  own behaviour and checks.
version: 1
scenarios:
  # ---------------------------------------------------------------- building
  - id: long_molecule_edit_session
    behaviour: execute
    brief: The user asks for a 3D model of a named small molecule.
    tools:
    - build_structure
    slots:
      molecule:
      - ethanol
      - toluene
      - pyridine
      - phenol
      - acetone
      - aniline
      group:
      - amino
      - fluoro
      - hydroxyl
      - methyl
      - nitro
      format:
      - xyz
      - pdb
      - cif
      - mol2
    followups:
    - behaviour: execute
      brief: The user asks to clean up its geometry quickly with the default force field.
      tools:
      - relax
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the molecular properties of the cleaned-up version.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks to replace one hydrogen of it with a named functional group.
      tools:
      - functionalise
      uses_prior_revision: true
      slots:
      - group
    - behaviour: execute
      brief: The user changes their mind and asks to take that last change back, without naming it.
      tools:
      - undo
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the molecule as a file in a stated format, meaning the version before the functional group.
      tools:
      - export_structure
      uses_prior_revision: true
      slots:
      - format
    variants: 5
  
  - id: long_zeolite_study_session
    behaviour: execute
    brief: The user asks for a named zeolite framework to be built.
    tools:
    - build_structure
    slots:
      zeolite:
      - MFI
      - CHA
      - LTA
      - FAU
      - SOD
    followups:
    - behaviour: execute
      brief: The user asks only for the porosity of it, nothing else.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks which silicon sites a substitution could act on, and says not to change anything yet.
      tools:
      - find_sites
      forbidden_tools:
      - replace_atom
      - substitute
      uses_prior_revision: true
    - behaviour: execute
      brief: The user says to go ahead and replace the sites you just listed with aluminium, one site only.
      tools:
      - replace_atom
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the analysis of the doped version, comparing it to the first.
      tools:
      - analyse
      uses_prior_revision: true
    - behaviour: execute
      brief: The user asks for the doped structure as a CIF.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 5
  
  - id: long_adsorption_session
    behaviour: execute
    brief: The user asks for a named zeolite to be built.
    tools:
    - build_structure
    slots:
      zeolite:
      - MFI
      - CHA
      - FAU
      gas:
      - CO2
      - methane
      - nitrogen
      temperature:
      - 298 K
      - 273 K
      temperature2:
      - 313 K
      - 323 K
    followups:
    - behaviour: execute
      brief: The user asks whether a named gas is available for adsorption studies, and says not to run anything yet.
      tools:
      - guest_search
      - guest_catalogue
      forbidden_tools:
      - guest_gcmc
      - guest_isotherm
      uses_prior_revision: true
      slots:
      - gas
    - behaviour: execute
      brief: The user asks for a quick Henry constant for that gas at a stated temperature.
      tools:
      - guest_isotherm
      forbidden_tools:
      - guest_gcmc
      uses_prior_revision: true
      slots:
      - temperature
    - behaviour: execute
      brief: The user asks for the same estimate at a different temperature, mentioning only the new temperature.
      tools:
      - guest_isotherm
      forbidden_tools:
      - guest_gcmc
      uses_prior_revision: true
      slots:
      - temperature2
    - behaviour: approval_hold
      brief: The user asks for a full GCMC uptake at one bar and the first temperature, without repeating the gas.
      tools:
      - guest_gcmc
      uses_prior_revision: true
      slots:
      - temperature
    - behaviour: execute
      brief: The user asks for the citation to use for this platform.
      tools:
      - citation
    variants: 5
  
  - id: long_curation_session
    behaviour: execute
    brief: The user has just uploaded a crystal file and asks the assistant to check it for overlapping or duplicated atoms.
    tools:
    - find_overlaps
    uses_prior_revision: true
