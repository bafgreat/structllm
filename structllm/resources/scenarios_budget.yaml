# Scenario specs for synthetic StructLLM conversations.
#
# A request writer turns each spec into several conversations; a teacher then
# answers them through the orchestrator against the development server. Specs
# describe what the user wants, never what the assistant says.
#
# behaviour: what a good answer to a user message does
#   execute        use the listed tools and report the result
#   clarify        required information is missing: ask, run nothing that changes anything
#   approval_hold  the request is expensive: submit once, report that it waits for approval
#   unsupported    StructSub cannot do it: say so (find_tools may be used to check)
#   failure        the input is invalid: report the backend error and how to fix it
#   discuss        answer from the conversation so far; run nothing that changes anything
# tools:           tools a good answer is expected to use
# forbidden_tools: tools a good answer must not use. These catch answers driven
#                  by words rather than meaning ("don't relax it" must not relax).
# uses_prior_revision: structure arguments must name a revision that already
#                  appeared in the conversation, so "it" is resolved from context.
# setup:           cheap calls made before the conversation; the last
#                  structure_revision_id is given as the current structure.
# slots:           values the writer must use so conversations differ in
#                  substance. A follow-up lists the slots it uses; the first
#                  message uses the rest. zip_slots: value i of each slot list
#                  belongs together.
# followups:       later user messages in the same conversation, each with its
#                  own behaviour and checks.
version: 1
scenarios:
  # ---------------------------------------------------------------- building
  - id: build_molecule_from_name
    behaviour: execute
    tools: [build_structure]
    brief: A chemist wants a 3D model of a small organic molecule they name in words.
    slots:
      molecule: [ethanol, caffeine, ibuprofen, para-xylene, glycine, cyclohexanone, naphthalene, urea]
    variants: 2

  - id: build_molecule_from_smiles
    behaviour: execute
    tools: [build_structure]
    brief: A user pastes a SMILES string and wants a structure built from it.
    slots:
      smiles: ["c1ccccc1O", "CC(=O)Oc1ccccc1C(=O)O", "OC(=O)c1ccc(cc1)C(=O)O", "C1CCOC1", "NCCO", "c1ccncc1", "CC(C)O"]
    variants: 2

  - id: build_zeolite
    behaviour: execute
    tools: [build_structure]
    brief: A user wants the framework of a zeolite given by its three-letter IZA code or common name.
    slots:
      zeolite: [MFI, FAU, LTA, CHA, BEA, MOR, SOD]
    variants: 2

  - id: build_peptide
    behaviour: execute
    tools: [build_structure]
    brief: A user wants a short peptide built from its amino-acid sequence, written as one-letter or three-letter codes.
    slots:
      sequence: [GGG, RMA, Ala-Gly-Ser, YGGFL, KLVFF]
    variants: 2

  - id: build_crystal_from_formula
    behaviour: execute
    tools: [build_structure, structure_type_candidates]
    brief: A user wants a model of a simple inorganic crystal given only by its chemical formula.
    slots:
      formula: [NaCl, CsCl, MgO, ZnS, CaF2]
    variants: 2

  - id: open_named_mof
    behaviour: execute
    tools: [open_named_framework]
    brief: >-
      A user wants a well-known MOF opened by its common name; the platform
      has a named-framework library but the user does not know any ids.
    slots:
      mof: [HKUST-1, UiO-66, MOF-5, ZIF-8, MIL-53]
    variants: 2

  - id: framework_topologies_for_units
    behaviour: execute
    tools: [match_frameworks, describe_units]
    brief: >-
      A user asks which network topologies a given metal node and organic
      linker could form together, before building anything.
    slots:
      combo: ["zinc paddlewheel with terephthalate", "copper paddlewheel with trimesate", "Zr6 cluster with terephthalate"]
    variants: 2

  # ----------------------------------------------------------------- lookups
  - id: list_available_engines
    behaviour: execute
    tools: [list_engines]
    brief: The user asks which optimisation methods or ML potentials the server offers and their licences.
    variants: 2

  - id: guest_lookup
    behaviour: execute
    tools: [guest_search, guest_catalogue]
    forbidden_tools: [guest_gcmc, guest_isotherm]
    brief: >-
      The user only asks whether a gas or small guest molecule is available for
      adsorption studies; they mention their future plans but do not ask for a
      simulation.
    slots:
      guest: [CO2, methane, nitrogen, water, xenon, hydrogen sulfide]
    variants: 2

  - id: zeolite_catalogue
    behaviour: execute
    tools: [list_zeolites]
    brief: The user asks which zeolite frameworks can be generated, or whether a particular one is among them.
    slots:
      zeolite: [AFI, MWW, TON, RHO]
    variants: 2

  - id: name_lookup
    behaviour: execute
    tools: [lookup_name, suggest_names, compound_entry]
    forbidden_tools: [build_structure]
    brief: The user asks what a chemical name or trade name refers to (formula, SMILES), without asking for a structure.
    slots:
      name: [paracetamol, TEDA, DABCO, BTC linker, IRMOF-1]
    variants: 2

  - id: structure_types_for_formula
    behaviour: execute
    tools: [structure_type_candidates, list_prototypes]
    forbidden_tools: [build_structure]
    brief: The user asks which crystal structure types a composition could take, before deciding what to build.
    slots:
      formula: [ABO3, AB2, TiO2, ZnO]
    variants: 2

  - id: fragment_library
    behaviour: execute
    tools: [list_fragments, list_amino_acids]
    brief: The user asks which functional groups or substituents are available to decorate linkers.
    variants: 2

  - id: sbu_search
    behaviour: execute
    tools: [search_sbus, list_sbu_library, salt_sbus, list_salts]
    brief: The user asks which metal secondary building units the library has for a motif, a metal salt or a known framework.
    slots:
      query: [paddlewheel, zinc nitrate hexahydrate, copper acetate, UiO-66, Zr6 oxo cluster]
    variants: 2

  - id: export_format_list
    behaviour: execute
    tools: [export_formats]
    brief: The user asks which file formats structures can be exported to, for example whether a code's input format is supported.
    slots:
      program: [VASP, LAMMPS, Gaussian, RASPA]
    variants: 2

  - id: cite_structsub
    behaviour: execute
    tools: [citation]
    brief: The user asks how to cite StructSub in a paper or thesis.
    followups:
      - behaviour: execute
        tools: [citation_file]
        slots: [citation_format]
        brief: The user asks for the citation as a file for their reference manager in a particular format, referring to the citation just shown.
    slots:
      citation_format: [BibTeX, RIS, EndNote]
    variants: 2

  - id: mobile_ion_list
    behaviour: execute
    tools: [list_mobile_ions]
    brief: The user asks which mobile ions the ion-transport tools support.
    variants: 2

  # ------------------------------------------------------------- export/edit
  - id: export_structure
    behaviour: execute
    tools: [export_structure]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{molecule_smiles}", name: "{molecule}"}}
    brief: The user wants the current structure as a file in a common format.
    zip_slots: true
    slots:
      molecule: [benzene, acetone, pyridine, methanol]
      molecule_smiles: ["c1ccccc1", "CC(C)=O", "c1ccncc1", "CO"]
      format: [cif, xyz, mol2, pdb]
    variants: 2

  - id: perceive_bond_orders
    behaviour: execute
    tools: [bond_orders]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: >-
      The user is about to write a format that carries bond orders and asks to
      make sure the aromatic and double bonds of the current molecule are
      assigned correctly.
    slots:
      smiles: ["c1ccccc1C=O", "C=CC(=O)O", "c1ccc2ccccc2c1"]
    variants: 2

  - id: find_sites_before_edit
    behaviour: execute
    tools: [find_sites]
    forbidden_tools: [replace_atom, functionalise, substitute, delete_atoms]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user wants to know which atoms of the current framework a planned
      substitution would act on (for example the Si sites, or the oxygens
      bridging two Si), and explicitly does not want anything changed yet.
    slots:
      zeolite: [MFI, CHA, LTA]
      element: [Si, O]
    variants: 2

  - id: functionalise_molecule
    behaviour: execute
    tools: [functionalise]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{molecule_smiles}", name: "{molecule}"}}
    brief: The user wants a functional group attached to the current aromatic molecule in place of a hydrogen.
    zip_slots: true
    slots:
      molecule: [benzene, toluene, benzoic acid]
      molecule_smiles: ["c1ccccc1", "Cc1ccccc1", "OC(=O)c1ccccc1"]
      group: [amino, fluoro, hydroxyl]
    variants: 2

  - id: functionalise_then_undo
    behaviour: execute
    tools: [functionalise]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{molecule_smiles}", name: "{molecule}"}}
    brief: The user asks to put a substituent on the current molecule.
    followups:
      - behaviour: execute
        tools: [undo]
        uses_prior_revision: true
        brief: The user changes their mind and asks to take that change back, without naming what the change was.
    zip_slots: true
    slots:
      molecule: [benzene, pyridine, toluene]
      molecule_smiles: ["c1ccccc1", "c1ccncc1", "Cc1ccccc1"]
      group: [nitro, chloro, methoxy]
    variants: 2

  - id: replace_metal_in_crystal
    behaviour: execute
    tools: [replace_atom, find_sites]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: The user wants every atom of one element in the current crystal changed to another element (a substitution study).
    zip_slots: true
    slots:
      formula: [MgO, NaCl, LiF]
      swap: ["Mg to Ca", "Na to K", "Li to Na"]
    variants: 2

  - id: delete_and_report_open_valences
    behaviour: execute
    tools: [delete_atoms]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to delete a specific atom by its index from the current molecule and wants to know what valences are left open.
    slots:
      smiles: ["CCO", "CC(=O)O", "c1ccccc1O"]
      index: ["0", "1", "2"]
    variants: 2

  - id: remove_solvent_guests
    behaviour: execute
    tools: [remove_guests]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user believes their framework still contains unbound solvent from
      synthesis and wants it removed before any adsorption work.
    slots:
      zeolite: [LTA, FAU]
    variants: 2

  - id: load_guest_molecules
    behaviour: execute
    tools: [load_guests]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants the pores of the current framework filled with a guest to a stated fraction of liquid density.
    slots:
      zeolite: [MFI, FAU]
      guest: [water, methanol, CO2]
      loading: ["50%", "0.75", "full"]
    variants: 2

  - id: prepare_peptide_for_md
    behaviour: execute
    tools: [prepare_biomolecule]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {sequence: "{sequence}"}}
    brief: The user wants the current peptide protonated at a stated pH and prepared for an AMBER or CHARMM simulation.
    slots:
      sequence: [GGG, YGGFL, KLVFF]
      pH: ["7", "7.4", "5"]
    variants: 2

  # --------------------------------------------------------------- analysis
  - id: analyse_built_structure
    behaviour: execute
    tools: [analyse]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user already has a zeolite open and wants its basic geometry and
      topology analysed (pore size, density, simulated PXRD peaks).
    slots:
      zeolite: [MFI, LTA, CHA, FAU]
    variants: 2

  - id: analyse_one_property_only
    behaviour: execute
    tools: [analyse]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user wants only one property of the current framework and says they
      do not need the rest (for example just porosity, or just the simulated
      powder pattern).
    slots:
      zeolite: [MFI, BEA, SOD]
      property: [porosity, PXRD, topology]
    variants: 2

  - id: topology_net_view
    behaviour: execute
    tools: [topology_net, analyse]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants the underlying topological net of the current framework so they can draw it.
    slots:
      zeolite: [SOD, LTA]
    variants: 2

  - id: widom_henry_constant
    behaviour: execute
    tools: [guest_isotherm]
    forbidden_tools: [guest_gcmc]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user wants a quick Henry's constant and heat of adsorption estimate
      for a gas in the current framework and explicitly does not want a full
      GCMC run.
    slots:
      zeolite: [MFI, CHA, FAU]
      guest: [CO2, CH4, N2]
      temperature: ["298 K", "273 K", "313 K"]
    variants: 2

  - id: iast_selectivity
    behaviour: execute
    tools: [guest_selectivity]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants the adsorption selectivity of a binary gas mixture of stated composition in the current framework.
    zip_slots: true
    slots:
      zeolite: [CHA, MFI, LTA]
      mixture: ["CO2/N2 15:85", "CO2/CH4 50:50", "C2H4/C2H6 50:50"]
    variants: 2

  - id: dock_single_guest
    behaviour: execute
    tools: [dock_guest]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants to know where one guest molecule binds most strongly in the current framework, without changing the structure.
    slots:
      zeolite: [MFI, FAU]
      guest: [CO2, water, methanol]
    variants: 2

  - id: elastic_moduli_fast
    behaviour: execute
    tools: [mechanics]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user wants a fast, rough estimate of the bulk and shear modulus of
      the current framework with a classical force field and accepts that it
      may be too stiff.
    slots:
      zeolite: [SOD, LTA]
    variants: 2

  - id: ion_migration_landscape
    behaviour: execute
    tools: [ion_migration]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: The user wants a quick bond-valence estimate of how easily a mobile ion moves through the current crystal.
    zip_slots: true
    slots:
      formula: [LiCoO2, NaCl, LiF]
      ion: [Li, Na, Li]
    variants: 2

  - id: force_field_relax
    behaviour: execute
    tools: [relax]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{molecule_smiles}", name: "{molecule}"}}
    brief: The user wants a quick force-field geometry optimisation of the current molecule.
    zip_slots: true
    slots:
      molecule: [ethanol, toluene, acetic acid, cyclohexane]
      molecule_smiles: ["CCO", "Cc1ccccc1", "CC(=O)O", "C1CCCCC1"]
    variants: 2

  - id: relax_ml_potential
    behaviour: approval_hold
    tools: [relax]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user explicitly asks to relax the current framework, including the
      cell, with a named machine-learned potential.
    slots:
      zeolite: [MFI, CHA, LTA]
      engine: [MACE, CHGNet, MatterSim, ORB]
    variants: 1

  - id: long_force_field_relax
    behaviour: approval_hold
    tools: [relax]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user wants a very thorough force-field optimisation of the current
      framework and asks for a specific large number of optimisation steps.
    slots:
      zeolite: [FAU, MFI]
      steps: ["5000", "8000", "10000"]
    variants: 1

  - id: gcmc_uptake
    behaviour: approval_hold
    tools: [guest_gcmc]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user wants a GCMC adsorption simulation of a named gas in the current
      framework at a stated temperature and pressure.
    slots:
      zeolite: [MFI, FAU, CHA]
      guest: [CO2, CH4, N2, Xe]
      conditions: ["298 K and 1 bar", "273 K, 0.1 to 10 bar", "313 K and 5 bar", "77 K and 1 bar"]
    variants: 1

  - id: breakthrough_curve
    behaviour: approval_hold
    tools: [guest_breakthrough]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants a simulated breakthrough curve for a gas mixture through a packed column of the current framework.
    slots:
      zeolite: [CHA, LTA]
      mixture: ["CO2/N2 15:85", "CH4/N2 50:50"]
    variants: 1

  - id: guest_diffusion_md
    behaviour: approval_hold
    tools: [guest_diffusion]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants the diffusion coefficient of a gas in the current framework from molecular dynamics.
    slots:
      zeolite: [MFI, CHA]
      guest: [CH4, CO2]
    variants: 1

  - id: battery_voltage
    behaviour: approval_hold
    tools: [ion_voltage]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: The user wants the average intercalation voltage and theoretical capacity of the current cathode material.
    slots:
      formula: [LiCoO2]
    variants: 1

  - id: ion_hop_neb
    behaviour: approval_hold
    tools: [ion_hop_barrier]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: The user wants the energy barrier of the rate-limiting ion hop in the current crystal from a NEB calculation.
    slots:
      formula: [LiCoO2, LiF]
    variants: 1

  - id: elastic_moduli_ml
    behaviour: approval_hold
    tools: [mechanics]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants accurate elastic constants of the current framework with a MACE-based model rather than the fast force field.
    slots:
      zeolite: [SOD, MFI]
    variants: 1

  # ---------------------------------------------------------------- clarify
  - id: gcmc_missing_conditions
    behaviour: clarify
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user asks for "the uptake" of the framework without naming a gas or
      any conditions; the assistant must ask before running anything.
    slots:
      zeolite: [MFI, LTA, FAU]
    variants: 2

  - id: build_ambiguous_target
    behaviour: clarify
    brief: >-
      The user asks to "build the MOF from the paper" or similar without any
      name, formula or file; nothing identifies the structure.
    variants: 2

  - id: relax_without_structure
    behaviour: clarify
    brief: >-
      In a brand-new conversation with nothing built or uploaded, the user asks
      to optimise "my structure" or "the molecule"; there is nothing to act on.
    variants: 2

  - id: selectivity_missing_composition
    behaviour: clarify
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user asks how selective the framework is "for the separation"
      without saying which gases or in what proportion.
    slots:
      zeolite: [CHA, MFI]
    variants: 2

  - id: swap_metal_without_target
    behaviour: clarify
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: The user asks to "swap the metal for a different one" in the current crystal without saying which element to use.
    slots:
      formula: [MgO, NaCl]
    variants: 2

  # ------------------------------------------------------------ unsupported
  - id: out_of_scope_requests
    behaviour: unsupported
    brief: >-
      The user asks for something StructSub does not offer, described in the
      slot (for example a plane-wave DFT band structure, a synthesis recipe, a
      reagent price quote, or a retrosynthesis route).
    slots:
      ask: [band structure, synthesis procedure, reagent prices, retrosynthesis, NMR spectrum, toxicity]
    variants: 2

  - id: approve_my_job
    behaviour: unsupported
    forbidden_tools: [guest_gcmc, relax, calculation_get, calculation_cancel]
    brief: >-
      The user asks the assistant to approve, or skip the approval of, an
      expensive job they submitted earlier in the StructSub interface; the
      assistant has no way to approve work and must not try to work around it.
    variants: 2

  - id: run_my_script
    behaviour: unsupported
    brief: >-
      The user pastes a short Python or shell snippet and asks the assistant to
      run it on the server, or to email or upload results somewhere.
    variants: 2

  # ---------------------------------------------------------------- failures
  - id: invalid_smiles
    behaviour: failure
    tools: [build_structure]
    brief: The user pastes a SMILES string with a typo (unbalanced ring closure or brackets).
    slots:
      smiles: ["c1ccccc", "CC(C(=O)O", "C1CC[NH3+", "C1CC(C1"]
    variants: 2

  - id: unknown_zeolite_code
    behaviour: failure
    tools: [build_structure]
    brief: The user asks for a zeolite by a three-letter code that does not exist.
    slots:
      zeolite: [ZQX, MFX, QQQ]
    variants: 2

  # ------------------------------------------- multi-turn, context-dependent
  - id: build_then_export
    behaviour: execute
    tools: [build_structure]
    brief: The user asks for a molecule to be built.
    followups:
      - behaviour: execute
        tools: [export_structure]
        uses_prior_revision: true
        slots: [format]
        brief: The user asks for "it" as a file in a stated format, without naming the molecule again.
    slots:
      molecule: [caffeine, ethanol, benzene, aspirin]
      format: [xyz, mol2, pdb, cif]
    variants: 2

  - id: invalid_then_corrected
    behaviour: failure
    tools: [build_structure]
    brief: The user pastes a SMILES string that contains a typo.
    followups:
      - behaviour: execute
        tools: [build_structure]
        slots: [fixed]
        brief: The user apologises for the typo and gives the corrected SMILES.
    zip_slots: true
    slots:
      smiles: ["c1ccccc", "CC(C(=O)O", "C1CCCC"]
      fixed: ["c1ccccc1", "CC(C)C(=O)O", "C1CCCC1"]
    variants: 2

  - id: lookup_then_simulate
    behaviour: execute
    tools: [guest_search, guest_catalogue]
    forbidden_tools: [guest_gcmc]
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user says they plan to simulate a stated gas at stated conditions in
      the current framework, but for now only asks whether that gas is
      available and asks not to run anything yet.
    followups:
      - behaviour: approval_hold
        tools: [guest_gcmc]
        uses_prior_revision: true
        brief: The user says to go ahead with the simulation now, without restating the gas or the conditions.
    slots:
      zeolite: [MFI, CHA, FAU]
      guest: [CO2, CH4, Kr]
      conditions: ["298 K and 1 bar", "273 K up to 10 bar", "195 K and 0.5 bar"]
    variants: 2

  - id: clarify_then_run
    behaviour: clarify
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks for the gas uptake of the current framework without naming a gas or conditions.
    followups:
      - behaviour: approval_hold
        tools: [guest_gcmc]
        uses_prior_revision: true
        slots: [guest, conditions]
        brief: The user answers the question with just the gas and the conditions, as a short reply.
    slots:
      zeolite: [MFI, LTA, CHA]
      guest: [CO2, N2, CH4]
      conditions: ["298 K, 1 bar", "273 K, 1 bar", "303 K, 0-20 bar"]
    variants: 2

  - id: gcmc_change_conditions
    behaviour: approval_hold
    tools: [guest_gcmc]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants a GCMC simulation of a gas in the current framework at stated conditions.
    followups:
      - behaviour: approval_hold
        tools: [guest_gcmc]
        uses_prior_revision: true
        slots: [new_conditions]
        brief: The user wants the same simulation at different conditions, mentioning only what changes.
    slots:
      zeolite: [MFI, FAU]
      guest: [CO2, CH4]
      conditions: ["298 K and 1 bar", "273 K and 1 bar"]
      new_conditions: ["273 K", "10 bar", "323 K"]
    variants: 1

  - id: held_job_followup
    behaviour: approval_hold
    tools: [guest_gcmc]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants a GCMC uptake of a gas at stated conditions in the current framework.
    followups:
      - behaviour: discuss
        forbidden_tools: [guest_gcmc, calculation_get, calculation_cancel]
        brief: >-
          The user asks whether the job has finished yet and whether the
          assistant can just approve it or push it through.
    slots:
      zeolite: [CHA, MFI]
      guest: [CO2, N2]
      conditions: ["298 K and 1 bar", "273 K and 5 bar"]
    variants: 1

  - id: negated_relax_then_export
    behaviour: execute
    tools: [export_structure]
    forbidden_tools: [relax]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{molecule_smiles}", name: "{molecule}"}}
    brief: >-
      The user says the geometry of the current molecule was already optimised
      elsewhere, tells the assistant not to optimise or relax it, and only
      wants it exported in a stated format.
    zip_slots: true
    slots:
      molecule: [toluene, acetone, pyridine]
      molecule_smiles: ["Cc1ccccc1", "CC(C)=O", "c1ccncc1"]
      format: [xyz, pdb, mol2]
    variants: 2

  - id: engines_then_ml_relax
    behaviour: execute
    tools: [list_engines]
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks which ML potentials are available on the server.
    followups:
      - behaviour: approval_hold
        tools: [relax]
        uses_prior_revision: true
        brief: >-
          The user asks to relax the current framework with "the most accurate
          one you listed that I am allowed to use", relying on the previous
          answer instead of naming an engine.
    slots:
      zeolite: [CHA, LTA]
    variants: 2

  - id: build_relax_analyse
    behaviour: execute
    tools: [build_structure]
    brief: The user asks for a molecule to be built.
    followups:
      - behaviour: execute
        tools: [relax]
        uses_prior_revision: true
        brief: The user asks to clean up its geometry quickly with a force field.
      - behaviour: execute
        tools: [analyse]
        uses_prior_revision: true
        brief: The user asks for the molecular properties of the optimised version.
    slots:
      molecule: [ethanol, acetone, glycine, toluene]
    variants: 2

  - id: two_structures_export_first
    behaviour: execute
    tools: [build_structure]
    brief: The user asks for a first molecule to be built.
    followups:
      - behaviour: execute
        tools: [build_structure]
        slots: [second]
        brief: The user asks for a second, different molecule.
      - behaviour: execute
        tools: [export_structure]
        uses_prior_revision: true
        slots: [format]
        brief: The user asks for "the first one" as a file in a stated format, not the one just built.
    slots:
      first: [benzene, methanol, acetic acid]
      second: [toluene, ethanol, formic acid]
      format: [xyz, pdb]
    variants: 2

  - id: widom_then_selectivity
    behaviour: execute
    tools: [guest_isotherm]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user wants a quick Henry-constant estimate for one gas in the current framework at a stated temperature.
    followups:
      - behaviour: execute
        tools: [guest_selectivity]
        uses_prior_revision: true
        slots: [partner]
        brief: >-
          The user asks how well it separates that gas from a second gas at
          the same temperature, naming only the second gas and the mixture
          ratio.
    slots:
      zeolite: [CHA, MFI]
      guest: [CO2]
      temperature: ["298 K", "273 K"]
      partner: ["N2 at 15:85", "CH4 at 50:50"]
    variants: 2

  - id: migration_then_barrier
    behaviour: execute
    tools: [ion_migration]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: The user wants a quick estimate of lithium-ion mobility in the current crystal.
    followups:
      - behaviour: approval_hold
        tools: [ion_hop_barrier]
        uses_prior_revision: true
        brief: The user wants a more rigorous barrier for the worst hop found, from a NEB-type calculation.
    slots:
      formula: [LiCoO2, LiF]
    variants: 2

  - id: unsupported_then_alternative
    behaviour: unsupported
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks for a DFT band gap of the current framework.
    followups:
      - behaviour: discuss
        brief: >-
          The user accepts that and asks what StructSub can do instead to
          characterise the framework, without asking for anything to be run yet.
    slots:
      zeolite: [MFI, LTA]
    variants: 2

  - id: result_question_after_build
    behaviour: execute
    tools: [build_structure]
    brief: The user asks for a molecule with a stereocentre or isomers to be built.
    followups:
      - behaviour: discuss
        forbidden_tools: [build_structure]
        brief: >-
          The user asks which isomer or stereoisomer was actually built, which
          can be answered from the previous result.
    slots:
      molecule: [ibuprofen, alanine, limonene, 2-butanol]
    variants: 2

  # ---------------------------------------------------- generated: multi-turn context
  - id: cov_import_cif_text
    behaviour: execute
    tools: [import_structure]
    brief: >-
      The user pastes the full text of a small CIF (a simple inorganic cell with a
      cell, space group and a few atom sites, written out in the message) and asks
      to load it so they can work with it.
    slots:
      material: [rock salt NaCl, fluorite CaF2, zinc blende ZnS, periclase MgO]
    variants: 2

  - id: cov_import_xyz_text
    behaviour: execute
    tools: [import_structure]
    brief: >-
      The user pastes the literal text of a small XYZ file for a molecule (atom
      count, comment line and coordinates all written out) and asks to load it.
    slots:
      molecule: [water, methanol, ammonia, ethene]
    variants: 2

  - id: cov_import_then_remove_guests
    behaviour: execute
    tools: [import_structure]
    brief: >-
      The user pastes the text of a small CIF of an as-synthesised framework-like
      crystal and asks to load it, saying it probably still contains solvent.
    followups:
      - behaviour: execute
        tools: [remove_guests]
        uses_prior_revision: true
        brief: The user asks to strip the unbound solvent from the file they just uploaded, keeping anything coordinated to a metal.
      - behaviour: execute
        tools: [analyse]
        uses_prior_revision: true
        brief: The user asks for the porosity of the cleaned structure.
    slots:
      material: [a zinc carboxylate framework, a copper paddlewheel framework, a zirconium oxo-cluster framework]
    variants: 2

  - id: cov_import_unparseable
    behaviour: failure
    tools: [import_structure]
    brief: The user pastes a CIF whose atom-site loop is cut off partway, or text that is not a structure file at all, and asks to load it.
    slots:
      problem: [truncated atom-site loop, missing cell parameters, a pasted paragraph of prose, an empty loop header]
    variants: 2

  # Building and editing
  - id: cov_space_group_menu
    behaviour: execute
    tools: [list_space_groups]
    brief: The user asks which space groups a crystal can be built in, or whether a particular one is available.
    slots:
      group: [Fm-3m, P2_1/c, Pnma, I4/mmm]
    variants: 2

  - id: cov_build_molecule_menu
    behaviour: execute
    tools: [list_build_molecules]
    brief: The user asks which molecules can be built by name, or whether a particular one is catalogued.
    slots:
      molecule: [toluene, DMF, THF, acetonitrile]
    variants: 2

  - id: cov_peptide_residues
    behaviour: execute
    tools: [list_monomers]
    brief: The user asks which residues and caps a peptide sequence may use, for example whether a modified or non-standard residue is allowed.
    slots:
      residue: [phosphoserine, N-methylalanine, D-alanine, acetyl cap]
    variants: 2

  - id: cov_add_hydrogens
    behaviour: execute
    tools: [add_hydrogens]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user says the current structure came from an X-ray file with no hydrogens and asks to add the missing ones.
    slots:
      smiles: ["CCO", "c1ccccc1O", "CC(=O)O"]
    variants: 2

  - id: cov_add_single_atom
    behaviour: execute
    tools: [add_atom]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to attach one extra atom of a named element to a specific atom of the current molecule, given by its index.
    zip_slots: true
    slots:
      smiles: ["CCO", "c1ccccc1", "CC(=O)O"]
      element: [Cl, F, Br]
      index: ["0", "2", "1"]
    variants: 2

  - id: cov_set_distance
    behaviour: execute
    tools: [set_geometry]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to set a named bond length, angle or dihedral between atoms given by index to a stated value, moving only the last atom.
    zip_slots: true
    slots:
      smiles: ["CCO", "CC(=O)O", "CCCC"]
      coordinate: ["the distance between atoms 0 and 1 to 1.60 angstrom", "the angle 0-1-2 to 115 degrees", "the dihedral 0-1-2-3 to 180 degrees"]
    variants: 2

  - id: cov_bond_order_change
    behaviour: execute
    tools: [set_bond_order]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to change the order of one bond, identified by the indices of its two atoms, for example from single to double.
    zip_slots: true
    slots:
      smiles: ["CC", "CCO", "CC=O"]
      change: ["make the bond between atoms 0 and 1 a double bond", "make the bond between atoms 1 and 2 a double bond", "turn the double bond between atoms 1 and 2 into a single bond"]
    variants: 2

  - id: cov_delete_one_bond
    behaviour: execute
    tools: [delete_bond]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to remove the bond between two atoms, given by index, while leaving both atoms in place.
    slots:
      smiles: ["CCO", "CCC", "COC"]
    variants: 2

  - id: cov_delete_hydrogens_then_redo
    behaviour: execute
    tools: [delete_atoms]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to delete one atom, by index, from the current molecule.
    followups:
      - behaviour: execute
        tools: [undo]
        uses_prior_revision: true
        brief: The user takes that back, without naming the atom.
      - behaviour: execute
        tools: [redo]
        uses_prior_revision: true
        brief: The user changes their mind again and asks to put the deletion back.
    slots:
      smiles: ["CCO", "CC(=O)O", "c1ccccc1O"]
    variants: 2

  - id: cov_substitute_linker
    behaviour: execute
    tools: [substitute, find_sites]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {smiles: "{smiles}"}}
    brief: The user asks to replace a whole substituent or fragment on the current molecule with a different one from the fragment library.
    zip_slots: true
    slots:
      smiles: ["Cc1ccccc1", "Oc1ccccc1", "Nc1ccccc1"]
      fragment: [methyl with trifluoromethyl, hydroxyl with methoxy, amino with nitro]
    variants: 2

  - id: cov_stack_layer_default_ab
    behaviour: execute
    tools: [stack_layers]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {crystal: "{layer}"}}
    brief: >-
      The user has a single hexagonal layer open and asks to make it a bulk
      crystal, or to stack it into graphite or the bulk form, and says nothing about
      the stacking registry. The assistant should stack it AB without asking.
    zip_slots: true
    slots:
      layer:
        - "P6/mmm a=2.46 c=15; C 1/3 2/3 0"
        - "P6/mmm a=2.50 c=15; B 1/3 2/3 0; N 2/3 1/3 0"
      material: [graphene, hexagonal boron nitride]
    variants: 2

  - id: cov_stack_layer_named_mode
    behaviour: execute
    tools: [stack_layers]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {crystal: "P6/mmm a=2.46 c=15; C 1/3 2/3 0"}}
    brief: The user has a graphene layer open and asks to stack it with a registry they name, so the default must not be used.
    slots:
      mode: [AA eclipsed, slipped by a stated offset]
    variants: 2

  - id: cov_build_graphene_then_stack
    behaviour: execute
    tools: [build_structure]
    brief: The user asks for a single graphene sheet.
    followups:
      - behaviour: execute
        tools: [stack_layers]
        uses_prior_revision: true
        brief: The user asks to make graphite from it and gives no stacking pattern.
    variants: 2

  - id: cov_deconstruct_units
    behaviour: execute
    tools: [deconstruct, get_building_unit]
    forbidden_tools: [substitute, delete_atoms]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks what the distinct building units of the current framework are, without changing anything.
    slots:
      zeolite: [SOD, LTA, CHA]
    variants: 2

  - id: cov_build_framework_from_units
    behaviour: execute
    tools: [build_framework, match_frameworks]
    brief: >-
      The user names a metal node, a linker and a topology and asks to assemble
      the periodic framework from them.
    zip_slots: true
    slots:
      node: [a Zn4O cluster, a Cu paddlewheel, a Zr6 cluster]
      linker: [terephthalate, trimesate, terephthalate]
      topology: [pcu, tbo, fcu]
    variants: 2

  - id: cov_build_polymer_chain
    behaviour: execute
    tools: [build_polymer]
    brief: The user asks for a periodic polymer chain built from a repeat unit and named end connection points.
    slots:
      monomer: [ethylene, styrene, ethylene glycol, lactic acid]
    variants: 2

  - id: cov_preview_before_build
    behaviour: execute
    tools: [preview_fragment, preview_guest]
    forbidden_tools: [build_structure, substitute, functionalise, load_guests]
    brief: >-
      The user wants to see what a named fragment or guest looks like in 3D before
      using it for anything, and says explicitly not to change any structure.
    slots:
      item: [a nitro group, a carboxylate, methanol as a guest, CO2 as a guest]
    variants: 2

  # Analysis, guests and transport
  - id: cov_flexible_breathing
    behaviour: approval_hold
    tools: [guest_flexible]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user asks whether the current framework breathes on adsorption of a
      stated gas, comparing its forms by adsorption at stated conditions.
    slots:
      zeolite: [MFI, CHA]
      guest: [CO2, CH4]
      conditions: ["298 K, 0.1 to 10 bar", "273 K, 1 bar"]
    variants: 1

  - id: cov_ion_diffusion
    behaviour: approval_hold
    tools: [ion_diffusion]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {formula: "{formula}"}}
    brief: >-
      The user wants the ion diffusivity, activation energy and room-temperature
      conductivity of the current crystal from molecular dynamics at stated
      temperatures.
    slots:
      formula: [LiCoO2, LiF]
      temperatures: ["300, 600 and 900 K", "400 to 1000 K in steps of 200"]
    variants: 1

  - id: cov_report_from_result
    behaviour: execute
    tools: [write_report]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks for a short report of what has been done to the current structure so far, as a Word or LaTeX file.
    slots:
      zeolite: [MFI, CHA]
      format: [Word, LaTeX, plain text]
    variants: 2

  # Measured diffraction patterns
  - id: cov_pxrd_attach_and_compare
    behaviour: execute
    tools: [pxrd_import_pattern]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: >-
      The user pastes a few lines of measured powder data (two columns, 2-theta and
      intensity, written out in the message) and asks to attach it to the current
      structure.
    followups:
      - behaviour: execute
        tools: [pxrd_compare]
        uses_prior_revision: true
        brief: The user asks how well the calculated pattern of the structure matches the measured one they just attached.
    slots:
      zeolite: [MFI, SOD]
    variants: 2

  - id: cov_pxrd_inspect_and_clear
    behaviour: execute
    tools: [pxrd_get_pattern]
    uses_prior_revision: true
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks which measured pattern is attached to the current structure, without changing anything.
    slots:
      zeolite: [MFI, LTA]
    variants: 2

  # Roadmap capabilities that are not tools yet. The model must say so plainly and
  # must not improvise with unrelated tools. When the capability exists these are
  # regenerated with the new tool in the catalogue.
  - id: cov_overlap_check_not_available
    behaviour: unsupported
    forbidden_tools: [delete_atoms, relax, remove_guests]
    brief: >-
      The user uploads or has loaded a crystal and asks the assistant to find atoms
      that sit on top of each other (overlapping or too-close atoms) and list them
      before anything is deleted. They do not ask for guest removal or relaxation.
    slots:
      cutoff: [0.5 angstrom, 0.8 angstrom, 1.0 angstrom, less than half the sum of covalent radii]
    variants: 2

  - id: cov_overlap_then_alternative
    behaviour: unsupported
    forbidden_tools: [delete_atoms, relax]
    setup:
      - tool: build_structure
        parameters: {body: {zeolite: "{zeolite}"}}
    brief: The user asks for a report of every pair of atoms in the current structure closer than a stated distance.
    followups:
      - behaviour: discuss
        brief: The user asks what they can do instead with the tools available to judge whether the structure is sensible, without asking for anything to be run yet.
    slots:
      zeolite: [MFI, LTA]
    variants: 2
  - id: ctx_actual_export_after_analysis_zeolite
    behaviour: execute
    tools:
    - analyse
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          zeolite: '{seed}'
    brief: User requests a descriptive analysis of {seed}, not an export.
    slots:
      seed:
      - MFI
      - CHA
      - LTA
      - FAU
      - BEA
      - MOR
      - SOD
    followups:
    - behaviour: execute
      brief: Later the user says “save that exact original, not a modified copy”, and requests an XYZ export.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_export_after_analysis_smiles
    behaviour: execute
    tools:
    - analyse
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          smiles: '{seed}'
    brief: User requests a descriptive analysis of {seed}, not an export.
    slots:
      seed:
      - c1ccccc1
      - Cc1ccccc1
      - c1ccncc1
      - CCO
      - CC(=O)O
      - c1ccccc1O
    followups:
    - behaviour: execute
      brief: Later the user says “save that exact original, not a modified copy”, and requests an XYZ export.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_export_after_analysis_formula
    behaviour: execute
    tools:
    - analyse
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          formula: '{seed}'
    brief: User requests a descriptive analysis of {seed}, not an export.
    slots:
      seed:
      - NaCl
      - MgO
      - LiF
      - ZnS
      - CaF2
    followups:
    - behaviour: execute
      brief: Later the user says “save that exact original, not a modified copy”, and requests an XYZ export.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_export_without_relax_zeolite
    behaviour: execute
    tools:
    - analyse
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          zeolite: '{seed}'
    brief: User asks to examine the geometry of {seed} without changing it.
    slots:
      seed:
      - MFI
      - CHA
      - LTA
      - FAU
      - BEA
      - MOR
      - SOD
    followups:
    - behaviour: execute
      brief: User asks for the unrelaxed original in CIF and explicitly forbids optimisation.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_export_without_relax_smiles
    behaviour: execute
    tools:
    - analyse
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          smiles: '{seed}'
    brief: User asks to examine the geometry of {seed} without changing it.
    slots:
      seed:
      - c1ccccc1
      - Cc1ccccc1
      - c1ccncc1
      - CCO
      - CC(=O)O
      - c1ccccc1O
    followups:
    - behaviour: execute
      brief: User asks for the unrelaxed original in CIF and explicitly forbids optimisation.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_export_without_relax_formula
    behaviour: execute
    tools:
    - analyse
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          formula: '{seed}'
    brief: User asks to examine the geometry of {seed} without changing it.
    slots:
      seed:
      - NaCl
      - MgO
      - LiF
      - ZnS
      - CaF2
    followups:
    - behaviour: execute
      brief: User asks for the unrelaxed original in CIF and explicitly forbids optimisation.
      tools:
      - export_structure
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_analyse_after_export_zeolite
    behaviour: execute
    tools:
    - export_structure
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          zeolite: '{seed}'
    brief: User exports {seed} and wants to keep working with the same revision.
    slots:
      seed:
      - MFI
      - CHA
      - LTA
      - FAU
      - BEA
      - MOR
      - SOD
    followups:
    - behaviour: execute
      brief: User says “now tell me its porosity/topology if relevant”, referring to the exported material.
      tools:
      - analyse
      uses_prior_revision: true
    variants: 1
  - id: ctx_actual_analyse_after_export_smiles
    behaviour: execute
    tools:
    - export_structure
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
