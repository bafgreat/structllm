# Scenario specs for synthetic StructLLM conversations.
#
# A request writer turns each spec into several conversations; a teacher then
# answers them through the orchestrator against the development server. Specs
# describe what the user wants, never what the assistant says.
#
# behaviour: what a good answer to a user message does
#   execute        use the listed tools and report the result
#   clarify        required information is missing: ask, run nothing that changes anything
#   approval_hold  the request is expensive: submit once, report that it waits for approval
#   unsupported    StructSub cannot do it: say so (find_tools may be used to check)
#   failure        the input is invalid: report the backend error and how to fix it
#   discuss        answer from the conversation so far; run nothing that changes anything
# tools:           tools a good answer is expected to use
# forbidden_tools: tools a good answer must not use. These catch answers driven
#                  by words rather than meaning ("don't relax it" must not relax).
# uses_prior_revision: structure arguments must name a revision that already
#                  appeared in the conversation, so "it" is resolved from context.
# setup:           cheap calls made before the conversation; the last
#                  structure_revision_id is given as the current structure.
# slots:           values the writer must use so conversations differ in
#                  substance. A follow-up lists the slots it uses; the first
#                  message uses the rest. zip_slots: value i of each slot list
#                  belongs together.
# followups:       later user messages in the same conversation, each with its
#                  own behaviour and checks.
version: 1
scenarios:
  # ---------------------------------------------------------------- building
  - id: core_substitute_linker
    behaviour: execute
    tools:
    - substitute
    uses_prior_revision: true
    brief: A user wants to swap the organic linker of a well-known MOF for a different linker and expects the new
      framework back, without asking which atoms.
    zip_slots: true
    slots:
      mof:
      - MOF-5
      - MOF-5
      - MOF-5
      - UiO-66
      - MOF-5
      linker:
      - a biphenyl linker
      - an amino-functionalised benzene linker
      - a naphthalene-2,6-diyl linker
      - a biphenyl linker
      - a methyl-substituted benzene linker
    variants: 8
  
  - id: core_substitute_one_linker
    behaviour: execute
    tools:
    - substitute
    uses_prior_revision: true
    brief: A user wants only one of the linkers of a well-known MOF replaced, not all of them, with a different linker,
      and expects the modified framework back.
    slots:
      mof:
      - MOF-5
      linker:
      - a biphenyl linker
      - an amino-functionalised benzene linker
      - a hydroxy-functionalised benzene linker
    variants: 4
  
  - id: core_substitute_then_compare
    behaviour: execute
    tools:
    - substitute
    uses_prior_revision: true
    brief: A user wants the linker of a well-known MOF swapped for a longer one.
    followups:
    - behaviour: execute
      tools:
      - analyse
      uses_prior_revision: true
      brief: The user asks how the cell and porosity of the new framework compare with the original, which they have
        not analysed yet.
    slots:
      mof:
      - MOF-5
      linker:
      - a biphenyl linker
      - a terphenyl linker
      - a naphthalene-2,6-diyl linker
    variants: 3
  
  - id: core_substitute_then_undo
    behaviour: execute
    tools:
    - substitute
    uses_prior_revision: true
    brief: A user wants the linker of a well-known MOF swapped for a different one.
    followups:
    - behaviour: execute
      tools:
      - undo
      uses_prior_revision: true
      brief: The user decides against it and asks to go back to the original framework.
    slots:
      mof:
      - MOF-5
      linker:
      - a biphenyl linker
      - a pyridine linker
    variants: 2
  
  - id: core_build_framework
    behaviour: execute
    tools:
    - build_framework
    brief: A user wants a periodic MOF assembled from a named metal node and a named organic linker, and leaves the
      choice of net to the assistant.
    zip_slots: true
    slots:
      node:
      - copper paddlewheel
      - copper paddlewheel
      - zinc paddlewheel
      - copper paddlewheel
      linker:
      - trimesic acid (benzene-1,3,5-tricarboxylic acid)
      - trimesic acid
      - trimesic acid
      - terephthalic acid
    variants: 5
  
  - id: core_match_then_build
    behaviour: execute
    tools:
    - match_frameworks
    - search_sbus
    - open_building_unit
    - get_building_unit
    brief: A user asks which network topologies a named metal node and organic linker could form together, before
      building anything.
    followups:
    - behaviour: execute
      tools:
      - build_framework
      brief: The user asks to build the best matching one, without naming the topology.
    slots:
      node:
      - copper paddlewheel
      linker:
      - trimesic acid (benzene-1,3,5-tricarboxylic acid)
    variants: 3
  
  - id: core_pxrd_refine_cell
    behaviour: execute
    tools:
    - pxrd_refine_cell
    uses_prior_revision: true
    setup:
    - tool: build_structure
      parameters:
        body:
          zeolite: SOD
    - tool: pxrd_import_pattern
      parameters:
        form:
          file:
            content: '{pattern}'
            filename: measured.xy
          wavelength: CuKa
    brief: The user has a measured powder pattern attached to the current sodalite structure and asks to refine the
      unit cell against it while keeping the chemistry.
