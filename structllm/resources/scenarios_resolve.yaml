# Scenario specs for synthetic StructLLM conversations.
#
# A request writer turns each spec into several conversations; a teacher then
# answers them through the orchestrator against the development server. Specs
# describe what the user wants, never what the assistant says.
#
# behaviour: what a good answer to a user message does
#   execute        use the listed tools and report the result
#   clarify        required information is missing: ask, run nothing that changes anything
#   approval_hold  the request is expensive: submit once, report that it waits for approval
#   unsupported    StructSub cannot do it: say so (find_tools may be used to check)
#   failure        the input is invalid: report the backend error and how to fix it
#   discuss        answer from the conversation so far; run nothing that changes anything
# tools:           tools a good answer is expected to use
# forbidden_tools: tools a good answer must not use. These catch answers driven
#                  by words rather than meaning ("don't relax it" must not relax).
# uses_prior_revision: structure arguments must name a revision that already
#                  appeared in the conversation, so "it" is resolved from context.
# setup:           cheap calls made before the conversation; the last
#                  structure_revision_id is given as the current structure.
# slots:           values the writer must use so conversations differ in
#                  substance. A follow-up lists the slots it uses; the first
#                  message uses the rest. zip_slots: value i of each slot list
#                  belongs together.
# followups:       later user messages in the same conversation, each with its
#                  own behaviour and checks.
version: 1
scenarios:
  # ---------------------------------------------------------------- building
  - id: res_name_to_structure
    behaviour: execute
    tools:
    - build_structure
    brief: A user asks for a zeolite by its common or trade name only, with no framework code and no composition,
      and expects it built.
    slots:
      name:
      - ZSM-5
      - zeolite beta
      - mordenite
      - ferrierite
      - MCM-22
      - zeolite L
      - ZSM-22
      - sodalite
      - SSZ-16
    variants: 6
  
  - id: res_trade_name_composition
    behaviour: execute
    tools:
    - build_structure
    brief: A user asks for a zeolite by a trade name that implies a particular composition and counter-ion, and expects
      that composition.
    slots:
      name:
      - zeolite X
      - 13X
      - NaY
      - HY
      - USY
      - zeolite A
      - 4A
      - 5A
      - TS-1
      - SSZ-13
      - Cu-SSZ-13
    variants: 7
  
  - id: res_name_covers_several_compositions
    behaviour: clarify
    forbidden_tools:
    - build_structure
    brief: A user asks for faujasite by name, which covers several different compositions, and has not said which
      they mean.
    slots:
      pick:
      - zeolite X
      - zeolite Y
      - the pure-silica one
      - the acid form of Y
    followups:
    - behaviour: execute
      tools:
      - build_structure
      brief: The user picks one of the compositions the assistant offered, in plain words, and asks for it to be built.
      slots:
      - pick
    variants: 4
  
  - id: res_build_all_variants
    behaviour: execute
    tools:
    - build_structure
    brief: A user asks for faujasite and says to build both the X and the Y forms, so they can compare them.
    variants: 2
  
  - id: res_material_not_available
    behaviour: unsupported
    forbidden_tools:
    - build_structure
    brief: A user asks for a zeolite by name that this platform cannot build, because its framework type is not offered.
    slots:
      name:
      - SSZ-39
      - ZSM-12
      - ZSM-23
      - ZSM-11
      - clinoptilolite
      - EMC-2
    variants: 4
  
  - id: res_aluminophosphate_not_built
    behaviour: unsupported
    forbidden_tools:
    - build_structure
    brief: A user asks for SAPO-34, a silicoaluminophosphate, which this platform can only approximate with the silicon
      framework of the same topology.
    followups:
    - behaviour: execute
      tools:
      - build_structure
      brief: The user accepts the offered alternative and asks for it to be built.
    variants: 2
  
  - id: res_typo
    behaviour: execute
    tools:
    - build_structure
    brief: A user misspells a common zeolite name by dropping or swapping a letter and expects the assistant to understand
      it and say what it took it to mean.
    slots:
      name:
      - chabazit
      - mordenit
      - ferrierit
      - faujasit
      - sodalit
    variants: 4
  
  - id: res_pore_window_list
    behaviour: execute
    tools:
    - resolve_zeolite
    brief: A user asks which zeolite frameworks have a pore limiting diameter in a stated range, without naming any.
    slots:
      range:
      - under 3.5 angstrom
      - between 4 and 5 angstrom
      - larger than 6.5 angstrom
      - between 5 and 6 angstrom
    followups:
    - behaviour: execute
      tools:
      - build_structure
      brief: The user asks to build the first framework from that list.
    variants: 4
  
  - id: res_unknown_name
    behaviour: clarify
    forbidden_tools:
    - build_structure
    brief: A user asks for a zeolite by a name that matches nothing the platform knows, such as zeolite Q, and does
      not give a framework code.
    slots:
      name:
      - zeolite Q
      - zeolite 9Z
      - ZSM-99
    variants: 3
  
  - id: res_bare_zeolite
    behaviour: clarify
    forbidden_tools:
    - build_structure
    brief: A user just says they want a zeolite built, without a name, a code or a property.
    variants: 2
  
  - id: res_name_then_pore_size
    behaviour: execute
    tools:
    - build_structure
    brief: A user asks for a zeolite by name and, in the same message, how big its pores are.
    slots:
      name:
      - ZSM-5
      - chabazite
      - zeolite Y
      - mordenite
    followups:
    - behaviour: execute
      tools:
      - analyse
      uses_prior_revision: true
      brief: The user asks for the porosity of the structure just built.
    variants: 4
  
