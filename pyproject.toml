[project]
name = "structllm"
version = "0.2.0"
description = "Tool-grounded StructSub assistant: MCP discovery, orchestration, data generation, fine-tuning and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp==2.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Synthetic request generation and teacher trajectories (run on a workstation, not on HPC).
datagen = [
    "anthropic>=1.13,<2",
]
# Fine-tuning and offline evaluation. Install CUDA torch on the cluster from the
# PyTorch index first (see hpc/setup_env.sh); this extra then reuses it.
train = [
    "torch>=2.6",
    "transformers>=5.19,<6",
    "peft>=0.21,<1",
    "accelerate>=1.15,<2",
    "safetensors>=0.5",
    "huggingface-hub>=1.0",
]
# 4-bit QLoRA (CUDA only).
qlora = [
    "bitsandbytes>=0.50",
]
dev = [
    "pytest>=8",
]

[project.scripts]
structllm = "structllm.cli:main"
structllm-train = "structllm.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["structllm*"]

[tool.setuptools.package-data]
structllm = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires the local StructSub development MCP server (cheap operations only)",
    "torch: requires the train extra (torch/transformers/peft)",
]
addopts = "-m 'not live'"
